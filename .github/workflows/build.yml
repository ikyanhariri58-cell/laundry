name: Masak APK Laundry

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Kita kunci di Ubuntu 22.04 biar stabil

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # INI PENTING: Kita paksa pake Java 17 biar Android SDK seneng
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bersih-bersih & Install Bumbu
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip build-essential git python3 python3-dev \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev \
            libavcodec-dev zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good libffi-dev libssl-dev automake autoconf \
            libtool pkg-config zip unzip libncurses5-dev libncursesw5-dev

      - name: Install Buildozer & Cython (Versi Kunci)
        run: |
          pip3 install --upgrade pip
          # Kita kunci Cython di versi 0.29.33 biar kompatibel sama Kivy
          pip3 install "Cython==0.29.33"
          pip3 install buildozer

      - name: Mulai Masak APK
        # Kita pakai yes | buat otomatis setuju lisensi SDK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Hasil Masakan
        uses: actions/upload-artifact@v4
        with:
          name: Laundry-APK
          path: bin/*.apk
