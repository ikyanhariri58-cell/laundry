name: Masak APK Laundry (Jalur Bypass)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # STEP BARU: Download FFmpeg yang udah jadi (Khusus Android ARM64)
      - name: Download FFmpeg Static Binary
        run: |
          # Download file binary ffmpeg
          wget -O ffmpeg https://github.com/mwati/ffmpeg-static-binaries/raw/master/ffmpeg-android-arm64
          # Kasih izin eksekusi
          chmod +x ffmpeg
          ls -l ffmpeg

      - name: Install Buildozer & Cython
        run: |
          pip3 install --upgrade pip
          pip3 install "Cython==0.29.33"
          pip3 install buildozer

      - name: Install Dependencies Dasar
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev zip unzip zlib1g-dev

      - name: Mulai Masak APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Hasil Masakan
        uses: actions/upload-artifact@v4
        with:
          name: Laundry-APK-Final
          path: bin/*.apk
