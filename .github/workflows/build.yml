- name: Siapkan Izin dan Lisensi
        run: |
          # 1. Pastikan file ffmpeg ada dan bisa dieksekusi
          if [ -f "ffmpeg" ]; then
            chmod +x ffmpeg
            echo "✅ Mesin FFmpeg ditemukan!"
          else
            echo "❌ ERROR: File ffmpeg tidak ada di root folder!"
            ls -R
            exit 1
          fi
          
          # 2. Terima lisensi Android SDK secara otomatis (cara lebih stabil)
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | sdkmanager --licenses || echo "Licenses already accepted or failed but moving on..."

    
