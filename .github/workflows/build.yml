name: Masak APK Laundry

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Kita siapin Java 17 buat Android SDK
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # HAPUS SEMUA LIBRARY KONFLIK (FFMPEG, SDL2, GSTREAMER DIHAPUS)
      # Kita cuma install alat tukang (Compiler) aja.
      - name: Bersih-bersih & Install Alat Tukang
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 python3-dev \
            libffi-dev libssl-dev automake autoconf \
            libtool pkg-config zip unzip zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake

      - name: Install Buildozer & Cython
        run: |
          pip3 install --upgrade pip
          # Kunci Cython di versi stabil
          pip3 install "Cython==0.29.33"
          pip3 install buildozer

      - name: Mulai Masak APK
        # yes | untuk auto-accept lisensi
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Hasil Masakan
        uses: actions/upload-artifact@v4
        with:
          name: Laundry-APK
          path: bin/*.apk
