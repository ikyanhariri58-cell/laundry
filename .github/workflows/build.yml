name: Masak APK Laundry Final

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Buildozer & Cython
        run: |
          pip3 install "Cython==0.29.33" buildozer
          sudo apt-get update
          sudo apt-get install -y build-essential zip unzip zlib1g-dev libffi-dev libssl-dev

      - name: Aktifkan Mesin FFmpeg
        run: |
          # 1. Cek apakah file ada
          if [ -f "ffmpeg" ]; then
            echo "✅ Mesin ketemu di root!"
            # 2. Kasih izin jalan (Ini yang paling penting)
            chmod +x ffmpeg
          else
            echo "❌ ERROR: File ffmpeg gak ada! Coba upload ulang ke halaman depan."
            ls -R
            exit 1
          fi

      - name: Mulai Masak APK
        run: |
          # Terima lisensi dulu biar gak Broken Pipe
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | sdkmanager --licenses || echo "License check skipped"
          buildozer -v android debug
